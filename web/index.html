<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23e8e0cc' stroke='%239a7a3e' stroke-width='2'/><circle cx='16' cy='16' r='9' fill='%232f5b44'/></svg>" />
    <title>Cited Research Assistant</title>
    <script>
      // Apply the saved theme before first paint (see src/theme.ts).
      (function () {
        var pref = null;
        try { pref = localStorage.getItem("cra-theme"); } catch (e) {}
        var dark = pref === "dark" || (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        // The reader's text size (see src/textSize.ts).
        try {
          var size = Number(localStorage.getItem("cra-text-size"));
          if (size) document.documentElement.style.setProperty("--text-scale", String(size));
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
